<form autocomplete="off">
  <div class="form-group">
    <label>Name</label>
    <input type="text" name="name" value="{{entry.name}}">
  </div>
  <div class="form-group">
    <label>Icon</label>
    <div class="form-fields">
      <input type="text" name="icon" value="{{entry.icon}}" placeholder="fa-radiation or modules/.../icon.svg">
      <button type="button" class="tmac-entry-pick-icon" title="Browse"><i class="fa-solid fa-file-import"></i></button>
    </div>
    <p class="hint">FontAwesome class (starts with <code>fa-</code>) or an image path.</p>
  </div>
  <div class="form-group">
    <label>Graphics &amp; Macros</label>
    <button type="button" class="tmac-entry-configure-graphics">
      <i class="fa-solid fa-palette"></i> Configure Graphics, Label & Macros…
    </button>
  </div>

  <footer class="tmac-footer">
    <button type="submit"><i class="fa-solid fa-save"></i> Save</button>
  </footer>
</form>
